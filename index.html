<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Expense Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b5ed7">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <img src="img/psu-logo.png" alt="PSU logo" class="logo" onerror="this.style.visibility='hidden'">
    <h1 class="site-title">Personal Expense Tracker</h1>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" title="Switch light / dark theme">🌙</button>
      <button id="logoutBtn" class="icon-btn hidden" title="Log out">🚪</button>
    </div>
  </header>
 
  <main id="app"></main>
  <div id="toast" class="toast hidden"></div>
 
  <script src="lib/chart.umd.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</body>
</html>
